# ============================================================
# Configuração NGINX para o CardápioZap
# Arquivo: /etc/nginx/sites-available/cardapiozap
# ============================================================
# Após criar:
#   sudo ln -s /etc/nginx/sites-available/cardapiozap /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Redireciona HTTP para HTTPS (ative após configurar o SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

